services:
  caddy:
    image: caddy:2-alpine
    profiles: ["caddy"]
    restart: unless-stopped
    env_file: ../.env.production
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: ../.env.production
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: price_tracker
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d price_tracker"]
      interval: 10s
      timeout: 5s
      retries: 10

  openserp:
    image: karust/openserp:latest
    restart: unless-stopped
    command: ["serve", "-a", "0.0.0.0", "-p", "7000"]
    environment:
      # Off by default in openserp itself — without this, our per-request X-Proxy-URL
      # header (see extractor.OpenSERPExtractor.setProxyHeader, backed by the proxy pool
      # in internal/proxypool) is rejected.
      OPENSERP_PROXIES_ALLOW_REQUEST_PROXY_URL: "true"
    # No published host port — only backend/worker (same compose network) reach it, at
    # http://openserp:7000. Free/self-hosted search+extract fallback, ahead of the paid
    # Serper/SerpAPI tiers.

  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    volumes:
      - ./searxng-settings.yml:/etc/searxng/settings.yml:ro
    # Private JSON metasearch API. No host port is published; only backend and worker
    # can reach it over the Compose network.

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ../.env.production
    extra_hosts:
      - "vpn.littlewell-app.work:host-gateway"
    environment:
      ENV: production
      PORT: "8080"
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/price_tracker?sslmode=disable
      APP_URL: https://${APP_DOMAIN}
      CORS_ORIGIN: https://${APP_DOMAIN}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      BOT_USERNAME: ${BOT_USERNAME}
      TELEGRAM_WEBHOOK_URL: https://${API_DOMAIN}/api/telegram/webhook
      SCRAPER_COOKIES_FILE: /run/secrets/scraper-cookies.json
      SCRAPER_PROFILE_DIR: /var/lib/pricebot/browser-profiles
      RENDERER_PROFILE_NAMESPACE: backend
      SCRAPER_PROXY_URL: ${SCRAPER_PROXY_URL:-}
      CF_RELAY_URL: ${CF_RELAY_URL:-}
      CF_RELAY_TOKEN: ${CF_RELAY_TOKEN:-}
      OPEN_SERP_BASE_URL: http://openserp:7000
      OPEN_SERP_ENGINES: ${OPEN_SERP_ENGINES:-google,bing,duckduckgo}
      OPEN_SERP_API_KEY: ${OPEN_SERP_API_KEY:-}
      SEARXNG_BASE_URL: http://searxng:8080
      SERPER_API_KEY: ${SERPER_API_KEY:-}
      SERPAPI_KEY: ${SERPAPI_KEY:-}
      SERPAPI_KEY_2: ${SERPAPI_KEY_2:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - ./secrets/scraper-cookies.json:/run/secrets/scraper-cookies.json:ro
      - browser_profiles:/var/lib/pricebot/browser-profiles
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-18080}:8080"
    depends_on:
      db:
        condition: service_healthy
      openserp:
        condition: service_started
      searxng:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["worker"]
    env_file: ../.env.production
    extra_hosts:
      - "vpn.littlewell-app.work:host-gateway"
    environment:
      ENV: production
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/price_tracker?sslmode=disable
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      BOT_USERNAME: ${BOT_USERNAME}
      SCRAPER_COOKIES_FILE: /run/secrets/scraper-cookies.json
      SCRAPER_PROFILE_DIR: /var/lib/pricebot/browser-profiles
      RENDERER_PROFILE_NAMESPACE: worker
      SCRAPER_PROXY_URL: ${SCRAPER_PROXY_URL:-}
      CF_RELAY_URL: ${CF_RELAY_URL:-}
      CF_RELAY_TOKEN: ${CF_RELAY_TOKEN:-}
      OPEN_SERP_BASE_URL: http://openserp:7000
      OPEN_SERP_ENGINES: ${OPEN_SERP_ENGINES:-google,bing,duckduckgo}
      OPEN_SERP_API_KEY: ${OPEN_SERP_API_KEY:-}
      SEARXNG_BASE_URL: http://searxng:8080
      SERPER_API_KEY: ${SERPER_API_KEY:-}
      SERPAPI_KEY: ${SERPAPI_KEY:-}
      SERPAPI_KEY_2: ${SERPAPI_KEY_2:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
    volumes:
      - ./secrets/scraper-cookies.json:/run/secrets/scraper-cookies.json:ro
      - browser_profiles:/var/lib/pricebot/browser-profiles
    depends_on:
      db:
        condition: service_healthy
      openserp:
        condition: service_started
      searxng:
        condition: service_started

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        PUBLIC_API_URL: https://${API_DOMAIN}
    restart: unless-stopped
    env_file: ../.env.production
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      API_URL: http://backend:8080
      PUBLIC_API_URL: https://${API_DOMAIN}
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/price_tracker?sslmode=disable
      BETTER_AUTH_URL: https://${APP_DOMAIN}
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-13000}:3000"
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started

  uptime-kuma:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    profiles: ["monitoring"]
    volumes:
      - uptime_kuma_data:/app/data
    ports:
      - "127.0.0.1:${UPTIME_KUMA_HOST_PORT:-13001}:3001"

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  uptime_kuma_data:
  browser_profiles:
